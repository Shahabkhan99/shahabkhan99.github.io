<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional 3D Rubik's Cube</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #383a46; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
            
            /* THE MOBILE FIXES */
            touch-action: none; 
            -webkit-touch-callout: none; 
        }
        
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-wrap: wrap; 
            gap: 10px;
            max-width: calc(100vw - 40px);
        }

        /* ========================================= */
        /* SPEEDCUBING TIMER WIDGET                  */
        /* ========================================= */
        .timer-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(28, 29, 36, 0.85);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #2a2e40;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        #timerDisplay {
            font-size: 32px;
            font-family: monospace;
            font-variant-numeric: tabular-nums;
            color: #facc15;
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .timer-wrapper {
                top: 80px; /* Moves below top buttons on mobile */
                right: 20px;
                padding: 10px 15px;
            }
            #timerDisplay { font-size: 24px; margin-bottom: 8px; }
            .timer-controls button { padding: 6px 12px; font-size: 12px; }
        }
        
        button {
            padding: 10px 16px;
            cursor: pointer;
            background: #2a2a2a;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s;
            touch-action: manipulation; 
        }

        button:hover { background: #444; border-color: #777; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .btn-blue { background: #0056b3; border-color: #007bff; }
        .btn-blue:hover { background: #007bff; border-color: #3399ff; }

        .btn-red { background: #b30000; border-color: #ff0000; }
        .btn-red:hover { background: #ff1a1a; border-color: #ff4d4d; }

        .btn-green { background: #008000; border-color: #00b300; }
        .btn-green:hover { background: #00b300; border-color: #00e600; }

        #hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #777;
            pointer-events: none; 
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-credits {
            font-size: 12px;
            color: #555;
        }
        .footer-credits a {
            color: #f39c12;
            text-decoration: none;
            pointer-events: auto; 
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <button id="shuffleBtn" class="btn-blue">Shuffle Cube</button>
        <button id="resetCubeBtn" class="btn-red">Reset Cube</button>
        <button id="resetCamBtn">Reset Camera</button>
    </div>

    <div class="timer-wrapper">
        <div id="timerDisplay">00:00.00</div>
        <div class="timer-controls">
            <button id="startTimerBtn" class="btn-green">Start</button>
            <button id="resetTimerBtn" class="btn-red">Reset</button>
        </div>
    </div>
    
    <div id="hint">
        <div><strong>Drag background</strong> to rotate camera. <br><strong>Drag a piece</strong> to turn a layer.</div>
        <div class="footer-credits">
            &copy; <span id="year"></span> SGAI | Designed by <a href="../index.html">SGAI</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#383a46');

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5.5, 5.5, 6.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enablePan = false;

        // --- 2. REALISTIC STICKER GENERATOR ---
        function getStickerMaterial(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 256, 256);
            
            ctx.fillStyle = colorHex;
            ctx.lineJoin = "round";
            ctx.lineWidth = 16;
            ctx.strokeStyle = colorHex;
            
            ctx.strokeRect(16, 16, 224, 224);
            ctx.fillRect(16, 16, 224, 224);
            
            const texture = new THREE.CanvasTexture(canvas);
            return new THREE.MeshBasicMaterial({ map: texture });
        }

        const blackMaterial = new THREE.MeshBasicMaterial({ color: 0x0a0a0a });

        const stickerColors = {
            right: getStickerMaterial('#b90000'),
            left: getStickerMaterial('#ff5900'),
            top: getStickerMaterial('#ffffff'),
            bottom: getStickerMaterial('#ffd500'),
            front: getStickerMaterial('#009b48'),
            back: getStickerMaterial('#0045ad')
        };

        // --- 3. BUILD THE CUBE ---
        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);
        
        const allCubies = [];

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const materials = [
                        x === 1 ? stickerColors.right : blackMaterial,
                        x === -1 ? stickerColors.left : blackMaterial,
                        y === 1 ? stickerColors.top : blackMaterial,
                        y === -1 ? stickerColors.bottom : blackMaterial,
                        z === 1 ? stickerColors.front : blackMaterial,
                        z === -1 ? stickerColors.back : blackMaterial
                    ];
                    
                    const geometry = new THREE.BoxGeometry(0.96, 0.96, 0.96);
                    const cubie = new THREE.Mesh(geometry, materials);

                    cubie.position.set(x, y, z);
                    
                    cubie.userData = { 
                        initialPosition: new THREE.Vector3(x, y, z),
                        initialRotation: new THREE.Quaternion()
                    };
                    
                    cubeGroup.add(cubie);
                    allCubies.push(cubie);
                }
            }
        }

        const pivot = new THREE.Object3D();
        scene.add(pivot);

        // --- 4. ANIMATE ROTATION ---
        let isAnimating = false;

        function rotateLayer(axis, level, direction, duration = 250) {
            return new Promise(resolve => {
                if (isAnimating) return resolve();
                isAnimating = true;

                const activeCubies = allCubies.filter(c => Math.abs(c.position[axis] - level) < 0.1);
                activeCubies.forEach(c => pivot.attach(c));

                const startAngle = pivot.rotation[axis];
                const targetAngle = startAngle + (Math.PI / 2) * direction;
                const startTime = performance.now();

                function animateStep(time) {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    const ease = 1 - Math.pow(1 - progress, 3);
                    pivot.rotation[axis] = startAngle + (targetAngle - startAngle) * ease;

                    if (progress < 1) {
                        requestAnimationFrame(animateStep);
                    } else {
                        pivot.rotation[axis] = targetAngle;
                        pivot.updateMatrixWorld();
                        
                        activeCubies.forEach(c => {
                            cubeGroup.attach(c);
                            c.position.x = Math.round(c.position.x);
                            c.position.y = Math.round(c.position.y);
                            c.position.z = Math.round(c.position.z);
                        });
                        
                        pivot.rotation.set(0, 0, 0);
                        isAnimating = false;
                        resolve();
                    }
                }
                requestAnimationFrame(animateStep);
            });
        }

        // --- 5. ADVANCED 3D DRAG MATH ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane();
        
        let dragStartMouse = null;
        let dragStart3D = new THREE.Vector3();
        let activeCubie = null;
        let activeNormal = new THREE.Vector3();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || isAnimating) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(allCubies);

            if (intersects.length > 0) {
                controls.enabled = false;
                activeCubie = intersects[0].object;
                
                activeNormal.copy(intersects[0].face.normal);
                activeNormal.transformDirection(activeCubie.matrixWorld).round();
                
                dragStart3D.copy(intersects[0].point);
                plane.setFromNormalAndCoplanarPoint(activeNormal, dragStart3D);
                
                dragStartMouse = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (!activeCubie || isAnimating) {
                controls.enabled = true;
                return;
            }

            const dx = e.clientX - dragStartMouse.x;
            const dy = e.clientY - dragStartMouse.y;
            
            if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                
                const dragEnd3D = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, dragEnd3D);
                
                if (dragEnd3D) {
                    const pullDirection = new THREE.Vector3().subVectors(dragEnd3D, dragStart3D);
                    const axisVector = new THREE.Vector3().crossVectors(activeNormal, pullDirection);
                    
                    const absX = Math.abs(axisVector.x);
                    const absY = Math.abs(axisVector.y);
                    const absZ = Math.abs(axisVector.z);
                    
                    let turnAxis, direction;

                    if (absX > absY && absX > absZ) {
                        turnAxis = 'x'; direction = Math.sign(axisVector.x);
                    } else if (absY > absX && absY > absZ) {
                        turnAxis = 'y'; direction = Math.sign(axisVector.y);
                    } else {
                        turnAxis = 'z'; direction = Math.sign(axisVector.z);
                    }

                    const level = activeCubie.position[turnAxis];
                    rotateLayer(turnAxis, level, Math.sign(direction));
                }
            }
            activeCubie = null;
            controls.enabled = true; 
        });

        window.addEventListener('pointercancel', () => {
            activeCubie = null;
            controls.enabled = true;
        });

        // --- 6. TIMER LOGIC ---
        let timerInterval;
        let startTime;
        let elapsedTime = 0;
        let isTimerRunning = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const startTimerBtn = document.getElementById('startTimerBtn');
        const resetTimerBtn = document.getElementById('resetTimerBtn');

        function updateTimerDisplay(time) {
            let date = new Date(time);
            let m = String(date.getUTCMinutes()).padStart(2, '0');
            let s = String(date.getUTCSeconds()).padStart(2, '0');
            let ms = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}.${ms}`;
        }

        startTimerBtn.addEventListener('click', () => {
            if (!isTimerRunning) {
                // START
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    updateTimerDisplay(elapsedTime);
                }, 10);
                isTimerRunning = true;
                startTimerBtn.textContent = 'Stop';
                startTimerBtn.classList.replace('btn-green', 'btn-blue');
            } else {
                // STOP
                clearInterval(timerInterval);
                isTimerRunning = false;
                startTimerBtn.textContent = 'Start';
                startTimerBtn.classList.replace('btn-blue', 'btn-green');
            }
        });

        // The Reset Button resets the time back to 00:00.00
        resetTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isTimerRunning = false;
            elapsedTime = 0;
            updateTimerDisplay(elapsedTime);
            startTimerBtn.textContent = 'Start';
            
            // Fixes button color if it was stopped mid-run
            if(startTimerBtn.classList.contains('btn-blue')) {
                startTimerBtn.classList.replace('btn-blue', 'btn-green');
            }
        });


        // --- 7. UI BUTTONS ---
        document.getElementById('resetCamBtn').addEventListener('click', () => {
            camera.position.set(5.5, 5.5, 6.5);
            controls.target.set(0,0,0);
        });

        document.getElementById('resetCubeBtn').addEventListener('click', () => {
            if (isAnimating) return;
            allCubies.forEach(cubie => {
                cubie.position.copy(cubie.userData.initialPosition);
                cubie.quaternion.copy(cubie.userData.initialRotation);
                cubie.updateMatrixWorld();
            });
        });

        document.getElementById('shuffleBtn').addEventListener('click', async () => {
            if (isAnimating) return;
            const axes = ['x', 'y', 'z'];
            const levels = [-1, 0, 1];
            const dirs = [1, -1];

            for (let i = 0; i < 20; i++) {
                const a = axes[Math.floor(Math.random() * 3)];
                const l = levels[Math.floor(Math.random() * 3)];
                const d = dirs[Math.floor(Math.random() * 2)];
                await rotateLayer(a, l, d, 75);
            }
        });

        // --- 8. RENDER LOOP ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
